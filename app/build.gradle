apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.example.tvbox"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.tvbox"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/INDEX.LIST', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    def media3Version = '1.4.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.leanback:leanback:1.0.0'

    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    // VLC for video playback
    implementation 'org.videolan.android:libvlc-all:3.6.5'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

}
